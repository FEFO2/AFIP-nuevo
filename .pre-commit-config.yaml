repos:
  - repo: local
    hooks:
      - id: private-files
        name: Bloquear archivos privados y generados
        entry: python scripts/check_private_files.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff
        name: Revisar Python
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Revisar formato Python
        entry: python -m ruff format --check
        language: system
        types: [python]
      - id: gitleaks
        name: Detectar secretos con Gitleaks
        entry: python scripts/check_secrets.py
        language: system
        pass_filenames: false
        always_run: true
